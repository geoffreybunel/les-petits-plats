<!doctype html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="./style.css" rel="stylesheet">
        <title>Les petits plats</title>
        <script src="https://kit.fontawesome.com/c498013e5e.js" crossorigin="anonymous"></script>
    </head>
    <body>
        <!-- Hero -->
        <header class="bg-[url('../src/assets/images/Hero.jpg')] bg-cover bg-center max-h-[667px] h-[100vh] relative flex justify-center">
            <div class="max-w-[250px] top-10 left-10 absolute">
                <img src="../src/assets/images/Logo-3.png" alt="Logo - Les petits plats" class="w-[100%]">
            </div>

            <div class="relative flex flex-col items-center justify-center text-center h-full w-5xl">
                <h1 class="font-title font-extrabold text-primary text-5xl tracking-wide leading-18">CHERCHEZ PARMI PLUS DE 1500 RECETTES <br> DU QUOTIDIEN,SIMPLES ET DÉLICIEUSES</h1>
                <div class="mt-6 w-full flex relative">
                    <input type="text" name="search" id="search" placeholder="Rechercher une recette, un ingrédient, ..." class="w-full bg-white outline-none p-4 rounded-xl text-tertiary text-lg">
                    <div class="absolute right-1 flex gap-5">
                        <img src="../src/assets/icons/deleteMainSearch.svg" alt="erase button" id="erase-button" class="cursor-pointer"/>
                        <button class="bg-secondary text-white p-4 rounded-xl hover:bg-primary hover:text-secondary h-[52px] w-[52px] mt-1 mb-1 cursor-pointer">
                            <i class="fa-solid fa-magnifying-glass text-2xl"></i>
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main content -->
        <main class="bg-background px-25 py-5 h-full w-full">            
            <!-- filters -->
            <section class="relative z-10 flex justify-between items-center h-14 mb-5">
                <div class="flex justify-between w-2/3 h-full">
                    <!-- ingredients -->
                    <div class="dropdown w-52">
                        <button class="dropdown-toggle flex justify-between items-center h-full w-full px-5 rounded-xl bg-white">
                            <span>Ingrédients</span>
                            <i class="arrow fa-solid fa-chevron-down"></i>
                        </button>

                        <div class="dropdown-menu bg-white w-full rounded-xl mt-[-20px] p-3 hidden">
                            <div class="relative">
                                <input type="text" data-type="ingredients" class="filter-search-input text-xs text-tertiary w-full border border-tertiary-light rounded-sm outline-none px-2 py-1 p-2">
                                <img src="../src/assets/icons/deleteSearch.svg" alt="close icon" class="delete-icon absolute right-7 top-2.5"/>
                                <img src="../src/assets/icons/Group 4.svg" alt="Search icon" class="absolute right-2 top-2"/>
                            </div>
                            <ul id="ingredientsList" data-type="ingredient" class="filters-lists max-h-64 overflow-y-auto mt-2"></ul>
                        </div>
                    </div>

                    <!-- Appliance -->
                    <div class="dropdown">
                        <button class="dropdown-toggle flex justify-between items-center h-full w-52 px-5 rounded-xl bg-white">
                            <span>Appareils</span>
                            <i class="arrow fa-solid fa-chevron-down"></i>
                        </button>

                        <div class="dropdown-menu bg-white w-full rounded-xl mt-[-20px] p-3 hidden">
                            <div class="relative">
                                <input type="text" data-type="appliance" class="filter-search-input text-xs text-tertiary w-full border border-tertiary-light rounded-sm outline-none px-2 py-1 p-2">
                                <img src="../src/assets/icons/deleteSearch.svg" alt="close icon" class="delete-icon absolute right-7 top-2.5"/>
                                <img src = "../src/assets/icons/Group 4.svg" alt="Search icon" class="absolute right-2 top-2"/>
                            </div>
                            <ul id="applianceList" data-type="appliance" class="filters-lists max-h-64 overflow-y-auto mt-2"></ul>
                        </div>
                    </div>

                    <!-- Ustensils -->
                    <div class="dropdown">
                        <button class="dropdown-toggle flex justify-between items-center h-full w-52 px-5 rounded-xl bg-white">
                            <span>Ustensiles</span>
                            <i class="arrow fa-solid fa-chevron-down"></i>
                        </button>

                        <div class="dropdown-menu bg-white w-full rounded-xl mt-[-20px] p-3 hidden">
                            <div class="relative">
                                <input type="text" data-type="ustensils" class="filter-search-input text-xs text-tertiary w-full border border-tertiary-light rounded-sm outline-none px-2 py-1 p-2">
                                <img src="../src/assets/icons/deleteSearch.svg" alt="close icon" class="delete-icon absolute right-7 top-2.5"/>
                                <img src = "../src/assets/icons/Group 4.svg" alt="Search icon" class="absolute right-2 top-2"/>
                            </div>
                            <ul id="ustensilsList" data-type="ustensil" class="filters-lists max-h-64 overflow-y-auto mt-2"></ul>
                        </div>
                    </div>
                </div>

                <!-- total recipes displayed -->
                <span id="total-recipes" class="font-title text-xl">50 recettes</span>
            </section>

            <!-- Tags -->
            <section id="tags-section" class="flex flex-wrap gap-2 mb-4"></section>

            <!-- Recipes -->
            <section id="recipes-section" class="my-8 grid grid-cols-3 gap-5"></section>
        </main>

        <script type="module" src="../src/scripts/main.js"></script>
    </body>
</html>
