        <header class="bg-[url('../src/assets/images/Hero.jpg')] bg-cover bg-center max-h-[667px] h-[100vh] relative flex justify-center">

                <div class="mt-6 w-full flex relative">
                    <input type="text" name="search" id="search" placeholder="Rechercher une recette, un ingrédient, ..." class="w-full bg-white outline-none p-4 rounded-xl text-tertiary text-lg">
                    <button class="bg-secondary text-white p-4 rounded-xl hover:bg-primary hover:text-secondary absolute right-1 h-[52px] w-[52px] mt-1 mb-1">
                        <i class="fa-solid fa-magnifying-glass text-2xl"></i>
                    </button>

            </div>
        </header>

            <h2>TO DO LIST - Filters</h2>
            <li>ajouter les tags au clic sur un élément</li>
            <li>filtrer selon ce qui est tapé dans 'input'</li>
            
            <!-- filters -->
            <section class="flex justify-between items-center h-14">
                <div class="flex justify-between w-2/3 h-full">
                    <!-- ingredients -->
                    <div class="dropdown w-52" data-type="ingredients">
                        <button class="dropdown-toggle flex justify-between items-center h-full w-full px-5 rounded-xl bg-white">
                            <span>Ingrédients</span>
                            <i class="arrow fa-solid fa-chevron-down"></i>
                        </button>

                        <div class="dropdown-menu bg-white z-10 w-full rounded-xl mt-[-20px] p-3 hidden">
                            <input type="text" id="searchInput" placeholder="Rechercher un ingrédient" class="text-xs text-tertiary w-full border border-tertiary outline-none px-2 py-1 p-2">
                            <ul id="ingredientsList" class="max-h-64 overflow-y-auto mt-2"></ul>
                        </div>
                    </div>

                    <!-- Appliance -->
                    <div class="dropdown" data-type="appliance">
                        <button class="dropdown-toggle flex justify-between items-center h-full w-52 px-5 rounded-xl bg-white">
                            <span>Appareils</span>
                            <i class="arrow fa-solid fa-chevron-down"></i>
                        </button>

                        <div class="dropdown-menu bg-white z-10 w-full rounded-xl mt-[-20px] p-3 hidden">
                            <input type="text" id="searchInput" placeholder="Rechercher un équipement" class="text-xs text-tertiary w-full border border-tertiary outline-none px-2 py-1 p-2">
                            <ul id="applianceList" class="max-h-64 overflow-y-auto mt-2"></ul>
                        </div>
                    </div>

                    <!-- Ustensils -->
                    <div class="dropdown" data-type="ustensils">
                        <button class="dropdown-toggle flex justify-between items-center h-full w-52 px-5 rounded-xl bg-white">
                            <span>Ustensiles</span>
                            <i class="arrow fa-solid fa-chevron-down"></i>
                        </button>

                        <div class="dropdown-menu bg-white z-10 w-full rounded-xl mt-[-20px] p-3 hidden">
                            <input type="text" id="searchInput" placeholder="Rechercher un ustensile" class="text-xs text-tertiary w-full border border-tertiary outline-none px-2 py-1 p-2">
                            <ul id="ustensilsList" class="max-h-64 overflow-y-auto mt-2"></ul>
                        </div>
                    </div>
                </div>

                <!-- total recipes displayed -->
                <span class="font-title text-xl">50 recettes</span>
            </section>
